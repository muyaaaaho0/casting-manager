<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐스팅 매니저</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f0;--surface:#fff;--border:#e0ddd6;--text:#1a1a1a;--muted:#888880;--accent:#2d5a8e;--accent-light:#e8f0f9;--green:#2d7a4f;--green-light:#e8f5ee;--red:#c0392b;--red-light:#fdf0ef;--yellow-light:#fef9e7;--yellow:#b7860b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-size:17px;font-weight:700;color:var(--text);}
.logo span{color:var(--accent);}
.header-actions{display:flex;gap:8px;}
#apiBanner{background:var(--yellow-light);border-bottom:1px solid #f0e0a0;padding:10px 24px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--yellow);flex-wrap:wrap;}
#apiBanner input{flex:1;min-width:200px;max-width:380px;font-size:13px;padding:6px 10px;border:1px solid #e0c060;border-radius:6px;background:white;font-family:monospace;}
#apiBanner button{padding:6px 14px;background:var(--yellow);color:white;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
#apiOkBanner{display:none;background:var(--green-light);border-bottom:1px solid #b0e0c0;padding:8px 24px;align-items:center;gap:10px;font-size:13px;color:var(--green);}
#apiOkBanner button{padding:4px 12px;background:transparent;border:1px solid var(--green);border-radius:6px;font-size:12px;color:var(--green);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
main{max-width:1100px;margin:0 auto;padding:24px 20px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat .n{font-size:26px;font-weight:700;line-height:1;margin-bottom:4px;}
.stat .l{font-size:12px;color:var(--muted);}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;margin-bottom:24px;background:var(--surface);transition:all 0.15s;}
.upload-zone.drag{border-color:var(--accent);background:var(--accent-light);}
.upload-zone .icon{font-size:30px;margin-bottom:8px;}
.upload-zone p{font-size:14px;font-weight:500;color:var(--text);margin-bottom:12px;}
.paste-box{display:inline-block;padding:8px 22px;border:2px dashed var(--accent);border-radius:8px;font-size:13px;color:var(--accent);background:var(--accent-light);min-width:200px;user-select:none;}
.paste-box.ok{border-color:var(--green);color:var(--green);background:var(--green-light);}
.upload-hint{font-size:11px;color:var(--muted);margin-top:8px;}
.or-divider{margin:0 12px;color:var(--muted);font-size:12px;}
.processing{background:var(--accent-light);border:1px solid #c0d8f0;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:none;align-items:center;gap:12px;font-size:13px;color:var(--accent);}
.spin{width:18px;height:18px;border:2px solid #a0c0e0;border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);font-size:13px;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.chip.on{background:var(--accent);color:white;border-color:var(--accent);}
.fsel{padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface);font-size:13px;color:var(--muted);font-family:'Noto Sans KR',sans-serif;}
.search-input{padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--surface);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;width:140px;}
.search-input:focus{border-color:var(--accent);}
.spacer{flex:1;}
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.actor-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-top{display:flex;}
.card-photo{width:90px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:white;min-height:120px;overflow:hidden;}
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
.card-info{flex:1;padding:12px 14px;border-left:1px solid var(--border);}
.card-name-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.card-name{font-size:15px;font-weight:700;}
.gbadge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;}
.male{background:#e8f0f9;color:#1a4a8e;}
.female{background:#fde8f0;color:#8e1a4a;}
.card-table{width:100%;font-size:12px;border-collapse:collapse;}
.card-table td{padding:2px 0;vertical-align:top;}
.card-table td:first-child{color:var(--muted);width:56px;white-space:nowrap;}
.card-bottom{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.card-btns{display:flex;gap:6px;}
.cbtn{font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.cbtn:hover{background:var(--bg);}
.cbtn.del:hover{background:var(--red-light);color:var(--red);}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:none;font-weight:500;}
.btn-primary{background:var(--accent);color:white;}
.btn-primary:hover{background:#1e4a7a;}
.btn-green{background:#03c75a;color:white;}
.btn-green:hover{background:#02a84a;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:12px;padding:24px;width:90%;max-width:480px;margin-bottom:40px;}
.modal h2{font-size:16px;font-weight:700;margin-bottom:20px;}
.frow{margin-bottom:12px;}
.frow label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500;}
.frow input,.frow select,.frow textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);outline:none;}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);}
.frow textarea{height:60px;resize:vertical;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.photo-preview{width:80px;height:90px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid var(--border);margin-top:8px;display:block;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);grid-column:1/-1;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;}
#fileInput{display:none;}
</style>
</head>
<body>
<header>
  <div class="logo">🎬 <span>캐스팅</span>매니저</div>
  <div class="header-actions">
    <button class="btn btn-green" onclick="copyToSheets()">📋 구글 시트로 복사</button>
    <button class="btn btn-primary" onclick="openAdd()">+ 배우 추가</button>
  </div>
</header>
<div id="apiBanner">
  ⚙️ Gemini API 키 입력 →
  <input type="password" id="apiKeyInput" placeholder="API 키 붙여넣기..." />
  <button onclick="saveApiKey()">저장</button>
</div>
<div id="apiOkBanner">
  ✅ Gemini API 연결됨 &nbsp;
  <button onclick="resetApiKey()">🔑 키 변경</button>
</div>
<main>
  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">전체 배우</div></div>
    <div class="stat"><div class="n" id="s-male" style="color:var(--accent)">0</div><div class="l">남자</div></div>
    <div class="stat"><div class="n" id="s-female" style="color:#8e2d5a">0</div><div class="l">여자</div></div>
  </div>

  <div class="upload-zone" id="uploadZone"
    ondragover="event.preventDefault();this.classList.add('drag')"
    ondragleave="this.classList.remove('drag')"
    ondrop="handleDrop(event)">
    <div class="icon">📸</div>
    <p>네이버 인물검색 / 소속사 프로필 스크린샷 — Gemini AI 자동 분석</p>
    <div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;">
      <button onclick="document.getElementById('fileInput').click()" class="btn btn-primary" style="font-size:13px;padding:7px 18px;">📁 파일 선택</button>
      <span class="or-divider">또는</span>
      <div id="pasteBox" class="paste-box">⌨️ 캡처 후 아무데서나 Ctrl+V</div>
    </div>
    <div class="upload-hint">윈도우+Shift+S 캡처 → 이 페이지에서 Ctrl+V</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="handleFileInput(event)" />
  <div class="processing" id="processingBox">
    <div class="spin"></div>
    <span>Gemini AI가 프로필 이미지를 분석하고 있어요...</span>
  </div>

  <div class="toolbar">
    <button class="chip on" id="g-all" onclick="setG('')">전체</button>
    <button class="chip" id="g-m" onclick="setG('남')">👨 남자</button>
    <button class="chip" id="g-f" onclick="setG('여')">👩 여자</button>
    <select class="fsel" id="f-age" onchange="render()">
      <option value="">전체 년생</option>
      <option value="2000">2000년대생</option>
      <option value="1990">90년대생</option>
      <option value="1980">80년대생</option>
      <option value="1970">70년대생</option>
      <option value="1960">60년대생</option>
    </select>
    <div class="spacer"></div>
    <input type="text" class="search-input" id="f-search" placeholder="🔍 이름 검색..." oninput="render()" />
  </div>
  <div class="actor-grid" id="actorGrid"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="mTitle">배우 추가</h2>
    <div class="frow"><label>이름 *</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="e-name" placeholder="배우 이름" oninput="clearAutoPhoto()" />
        <button type="button" onclick="searchPhoto()" class="btn btn-primary" style="white-space:nowrap;font-size:12px;padding:6px 12px;">🔍 사진</button>
      </div>
    </div>
    <div id="photoResults" style="display:none;margin-bottom:12px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">사진 선택 (클릭)</div>
      <div id="photoGrid" style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;"></div>
    </div>
    <div class="fgrid">
      <div class="frow" style="margin:0"><label>성별</label>
        <select id="e-gender"><option value="여">여자</option><option value="남">남자</option></select>
      </div>
      <div class="frow" style="margin:0"><label>출생년도</label>
        <input type="number" id="e-birth" placeholder="예: 1996" />
      </div>
    </div>
    <div class="frow"><label>키 (cm)</label><input type="number" id="e-height" placeholder="예: 189" /></div>
    <div class="frow"><label>소속사</label><input type="text" id="e-agency" placeholder="예: 아메르 엔터테인먼트" /></div>
    <div class="frow"><label>출연작품</label><textarea id="e-works" placeholder="드라마, 영화명 등..."></textarea></div>
    <div class="frow"><label>스케줄</label><input type="text" id="e-schedule" placeholder="예: ~2026년 12월까지 작품 있음" /></div>
    <div class="frow"><label>현황</label><textarea id="e-notes" placeholder="현재 상황, 특이사항..."></textarea></div>
    <div id="imgPreviewWrap"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveActor()">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const AV_COLORS=['#2d5a8e','#2d7a4f','#8e2d5a','#7a5a2d','#5a2d8e','#2d7a7a'];
let actors=[],nextId=1,editId=null,pendingImg=null,gFilter='';
let apiKey=localStorage.getItem('gemini_api_key')||'';

function koreanAge(birth){ return birth ? new Date().getFullYear() - birth + 1 : 0; }

function init(){
  const saved=localStorage.getItem('casting_actors');
  if(saved){actors=JSON.parse(saved);nextId=actors.length?Math.max(...actors.map(a=>a.id))+1:1;}
  else{
    actors=[
      {id:1,name:'김태리',gender:'여',birth:1990,height:168,agency:'블러썸 엔터테인먼트',works:'미스터 션샤인, 지리산, 승리호',schedule:'',notes:'',img:null},
      {id:2,name:'이병헌',gender:'남',birth:1970,height:177,agency:'BH 엔터테인먼트',works:'킹덤, 비상선언, 달콤한 인생',schedule:'~2026년 6월까지 작품 있음',notes:'',img:null},
      {id:3,name:'김현진',gender:'남',birth:1996,height:189,agency:'아메르 엔터테인먼트',works:'러브포비아, 아이돌마이, 알미운 사랑',schedule:'',notes:'',img:null},
    ];
    nextId=4;
  }
  updateApiBanner();render();
}

function updateApiBanner(){
  if(apiKey){document.getElementById('apiBanner').style.display='none';document.getElementById('apiOkBanner').style.display='flex';}
  else{document.getElementById('apiBanner').style.display='flex';document.getElementById('apiOkBanner').style.display='none';}
}
function saveApiKey(){const k=document.getElementById('apiKeyInput').value.trim();if(!k)return;apiKey=k;localStorage.setItem('gemini_api_key',k);updateApiBanner();showToast('✓ API 키 저장됨!');}
function resetApiKey(){apiKey='';localStorage.removeItem('gemini_api_key');document.getElementById('apiKeyInput').value='';updateApiBanner();}
function save(){localStorage.setItem('casting_actors',JSON.stringify(actors));}

function ageGroup(b){
  if(!b)return null;
  if(b>=2000)return 2000;
  if(b>=1990)return 1990;
  if(b>=1980)return 1980;
  if(b>=1970)return 1970;
  return 1960;
}

function setG(g){
  gFilter=g;
  ['g-all','g-m','g-f'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(g===''?'g-all':g==='남'?'g-m':'g-f').classList.add('on');
  render();
}

function render(){
  const s=document.getElementById('f-search').value.toLowerCase();
  const ag=document.getElementById('f-age').value;
  const list=actors.filter(a=>{
    if(gFilter&&a.gender!==gFilter)return false;
    if(ag&&ageGroup(a.birth)!=parseInt(ag))return false;
    if(s&&!a.name.toLowerCase().includes(s))return false;
    return true;
  });
  document.getElementById('s-total').textContent=actors.length;
  document.getElementById('s-male').textContent=actors.filter(a=>a.gender==='남').length;
  document.getElementById('s-female').textContent=actors.filter(a=>a.gender==='여').length;
  const grid=document.getElementById('actorGrid');
  if(!list.length){grid.innerHTML='<div class="empty"><div style="font-size:36px;margin-bottom:10px;">🔍</div><p>조건에 맞는 배우가 없어요.</p></div>';return;}
  grid.innerHTML=list.map(a=>{
    const col=AV_COLORS[a.id%AV_COLORS.length];
    const age=a.birth?`${koreanAge(a.birth)}세 (${a.birth}년생)`:'';
    const photo=a.img?`<img src="${a.img}" alt="${a.name}" />`:`<div style="width:100%;height:100%;background:${col};display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;">${a.name.slice(0,1)}</div>`;
    return`<div class="actor-card">
      <div class="card-top">
        <div class="card-photo">${photo}</div>
        <div class="card-info">
          <div class="card-name-row">
            <span class="card-name">${a.name}</span>
            <span class="gbadge ${a.gender==='남'?'male':'female'}">${a.gender==='남'?'남자':'여자'}</span>
          </div>
          <table class="card-table">
            ${age?`<tr><td>나이</td><td>${age}</td></tr>`:''}
            ${a.height?`<tr><td>신체</td><td>${a.height}cm</td></tr>`:''}
            ${a.agency?`<tr><td>소속사</td><td>${a.agency}</td></tr>`:''}
            ${a.works?`<tr><td>출연작</td><td>${a.works}</td></tr>`:''}
            ${a.schedule?`<tr><td>스케줄</td><td style="color:var(--red)">${a.schedule}</td></tr>`:''}
            ${a.notes?`<tr><td>현황</td><td style="color:var(--muted)">${a.notes}</td></tr>`:''}
          </table>
        </div>
      </div>
      <div class="card-bottom">
        <div class="card-btns">
          <button class="cbtn" onclick="openEdit(${a.id})">✏️ 수정</button>
          <button class="cbtn del" onclick="del(${a.id})">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function handleDrop(e){e.preventDefault();document.getElementById('uploadZone').classList.remove('drag');const file=e.dataTransfer.files[0];if(file&&file.type.startsWith('image/'))processImage(file);}
function handleFileInput(e){const file=e.target.files[0];if(file)processImage(file);e.target.value='';}

async function processImage(file){
  if(!apiKey){updateApiBanner();showToast('⚠️ API 키를 먼저 입력해주세요');return;}
  const reader=new FileReader();
  reader.onload=async function(ev){
    const imgData=ev.target.result;
    const base64=imgData.split(',')[1];
    document.getElementById('processingBox').style.display='flex';
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`You are a data extraction assistant. Look at this Korean actor profile image and extract information. Return ONLY a valid JSON object. No explanation, no markdown, no backticks.\n{"name":"actor name in Korean","gender":"남 or 여","birth":year_or_null,"height":height_cm_or_null,"agency":"agency or null","works":"work1, work2 or null"}`},{inline_data:{mime_type:file.type,data:base64}}]}],generationConfig:{temperature:0,maxOutputTokens:300,responseMimeType:"application/json"}})});
      const data=await res.json();
      document.getElementById('processingBox').style.display='none';
      let extracted={};
      try{const raw=data.candidates[0].content.parts[0].text||'';const match=raw.replace(/```json/gi,'').replace(/```/g,'').trim().match(/\{[\s\S]*\}/);if(match)extracted=JSON.parse(match[0]);}catch(e){}
      pendingImg=imgData;
      showToast((extracted.name||extracted.agency)?'✅ 자동 추출 완료!':'⚠️ 추출 실패 — 직접 입력해주세요');
      openAdd(extracted);
    }catch(err){document.getElementById('processingBox').style.display='none';showToast('❌ API 오류: '+err.message);pendingImg=imgData;openAdd({});}
  };
  reader.readAsDataURL(file);
}

function clearAutoPhoto(){
  document.getElementById('photoResults').style.display='none';
  document.getElementById('photoGrid').innerHTML='';
}

function searchPhoto(){
  const name=document.getElementById('e-name').value.trim();
  if(!name){showToast('이름을 먼저 입력해주세요');return;}
  const grid=document.getElementById('photoGrid');
  const results=document.getElementById('photoResults');
  grid.innerHTML='<div style="font-size:12px;color:var(--muted);">검색 중...</div>';
  results.style.display='block';
  fetch(`https://ko.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`)
    .then(r=>r.json())
    .then(data=>{
      grid.innerHTML='';
      const imgs=[];
      if(data.thumbnail&&data.thumbnail.source)imgs.push(data.thumbnail.source);
      if(data.originalimage&&data.originalimage.source)imgs.push(data.originalimage.source);
      if(imgs.length>0){
        imgs.forEach(url=>{
          const img=document.createElement('img');
          img.src=url;
          img.style.cssText='width:70px;height:90px;object-fit:cover;object-position:top;border-radius:6px;cursor:pointer;border:2px solid transparent;';
          img.onclick=function(){
            document.querySelectorAll('#photoGrid img').forEach(i=>i.style.borderColor='transparent');
            this.style.borderColor='var(--accent)';
            const canvas=document.createElement('canvas');
            const ctx=canvas.getContext('2d');
            const tempImg=new Image();
            tempImg.crossOrigin='anonymous';
            tempImg.onload=function(){
              canvas.width=tempImg.width;canvas.height=tempImg.height;
              ctx.drawImage(tempImg,0,0);
              try{pendingImg=canvas.toDataURL('image/jpeg');}catch(e){pendingImg=url;}
              document.getElementById('imgPreviewWrap').innerHTML=`<img src="${pendingImg}" class="photo-preview" />`;
              showToast('✓ 사진 선택됨!');
            };
            tempImg.onerror=function(){pendingImg=url;document.getElementById('imgPreviewWrap').innerHTML=`<img src="${url}" class="photo-preview" />`;showToast('✓ 사진 선택됨!');};
            tempImg.src=url;
          };
          img.onerror=function(){this.remove();};
          grid.appendChild(img);
        });
        const link=document.createElement('div');
        link.style.cssText='width:100%;margin-top:8px;';
        link.innerHTML=`<a href="https://www.google.com/search?q=${encodeURIComponent(name+' 배우')}&tbm=isch" target="_blank" style="font-size:12px;color:var(--accent);">🔍 구글에서 더 찾기 →</a>`;
        grid.appendChild(link);
      } else {
        showGoogleSearch(name,grid);
      }
    })
    .catch(()=>showGoogleSearch(name,grid));
}

function showGoogleSearch(name,grid){
  grid.innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">위키피디아에서 찾지 못했어요.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="https://www.google.com/search?q=${encodeURIComponent(name+' 배우 프로필')}&tbm=isch" target="_blank" class="btn btn-primary" style="font-size:12px;padding:5px 12px;text-decoration:none;">🔍 구글 이미지 검색</a>
      <button onclick="document.getElementById('fileInput').click()" class="btn btn-outline" style="font-size:12px;padding:5px 12px;">📁 파일 직접 선택</button>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted);">구글에서 사진 찾은 후 → 오른쪽 클릭 → 복사 → 이 페이지에서 Ctrl+V</div>`;
}

function openAdd(prefill){
  editId=null;pendingImg=null;
  document.getElementById('mTitle').textContent=(prefill&&Object.keys(prefill).length)?'AI가 추출한 정보 확인':'배우 추가';
  document.getElementById('e-name').value=prefill?.name||'';
  document.getElementById('e-gender').value=(prefill?.gender==='남')?'남':'여';
  document.getElementById('e-birth').value=prefill?.birth||'';
  document.getElementById('e-height').value=prefill?.height||'';
  document.getElementById('e-agency').value=prefill?.agency||'';
  document.getElementById('e-works').value=prefill?.works||'';
  document.getElementById('e-schedule').value='';
  document.getElementById('e-notes').value='';
  document.getElementById('imgPreviewWrap').innerHTML='';
  document.getElementById('photoResults').style.display='none';
  document.getElementById('photoGrid').innerHTML='';
  document.getElementById('modal').classList.add('open');
}
function openEdit(id){
  const a=actors.find(x=>x.id===id);editId=id;pendingImg=a.img;
  document.getElementById('mTitle').textContent='배우 정보 수정';
  document.getElementById('e-name').value=a.name;
  document.getElementById('e-gender').value=a.gender;
  document.getElementById('e-birth').value=a.birth||'';
  document.getElementById('e-height').value=a.height||'';
  document.getElementById('e-agency').value=a.agency;
  document.getElementById('e-works').value=a.works||'';
  document.getElementById('e-schedule').value=a.schedule||'';
  document.getElementById('e-notes').value=a.notes||'';
  document.getElementById('imgPreviewWrap').innerHTML=a.img?`<img src="${a.img}" class="photo-preview" />`:'';
  document.getElementById('photoResults').style.display='none';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');pendingImg=null;editId=null;}
function saveActor(){
  const name=document.getElementById('e-name').value.trim();
  if(!name){document.getElementById('e-name').focus();return;}
  const d={name,gender:document.getElementById('e-gender').value,birth:parseInt(document.getElementById('e-birth').value)||null,height:parseInt(document.getElementById('e-height').value)||null,agency:document.getElementById('e-agency').value.trim(),works:document.getElementById('e-works').value.trim(),schedule:document.getElementById('e-schedule').value.trim(),notes:document.getElementById('e-notes').value.trim(),img:pendingImg};
  if(editId){const i=actors.findIndex(a=>a.id===editId);actors[i]={...actors[i],...d};}
  else{actors.unshift({id:nextId++,...d});}
  save();closeModal();render();showToast('✓ 저장됐어요');
}
function del(id){if(!confirm('삭제할까요?'))return;actors=actors.filter(a=>a.id!==id);save();render();}

function copyToSheets(){
  // 사진을 구글 시트 IMAGE 함수로 포함
  let rows=[];
  actors.forEach(a=>{
    const imgFormula = a.img ? `=IMAGE("${a.img.startsWith('data:') ? '' : a.img}")` : '';
    rows.push([imgFormula, '출생년도', a.birth||'', '신 체', a.height||'', '현 황', a.notes||'']);
    rows.push(['','','','','','','']);
    rows.push(['','','','','','','']);
    rows.push(['','','','','','','']);
    rows.push(['','출연작품', a.works||'','','','','']);
    rows.push(['','소 속 사', a.agency||'','','스케줄',a.schedule||'','']);
    rows.push([a.name,'','','','','','']);
    rows.push(['','','','','','','']);
  });
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>showToast('✓ 복사 완료! 구글 시트에서 Ctrl+V 하세요')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✓ 복사 완료! 구글 시트에서 Ctrl+V 하세요');
  });
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

document.addEventListener('paste',function(e){
  if(document.getElementById('modal').classList.contains('open'))return;
  const cd=e.clipboardData||e.originalEvent.clipboardData;if(!cd)return;
  let imgFile=null;
  for(let i=0;i<cd.items.length;i++){if(cd.items[i].type.startsWith('image/')){imgFile=cd.items[i].getAsFile();break;}}
  if(imgFile){e.preventDefault();const pb=document.getElementById('pasteBox');pb.textContent='✅ 감지됨! 분석 중...';pb.className='paste-box ok';setTimeout(()=>{pb.textContent='⌨️ 캡처 후 아무데서나 Ctrl+V';pb.className='paste-box';},3000);processImage(imgFile);}
});

init();
</script>
